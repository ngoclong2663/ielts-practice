<text x="410.0" y="147.5" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >raised</text>
<circle cx="318.0" cy="102.0" r="13" fill="#1f2933"/><text x="318.0" y="107.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >1</text>
<rect x="513.5" y="182.9" width="184.0" height="56.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="605.5" y="210.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Manure and food</text>
<text x="605.5" y="228.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >waste collected</text>
<circle cx="513.4578706170074" cy="182.94969260037232" r="13" fill="#1f2933"/><text x="513.5" y="187.9" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >2</text>
<rect x="561.7" y="364.8" width="184.0" height="56.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="653.7" y="392.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Waste shredded and</text>
<text x="653.7" y="410.3" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >mixed with water</text>
<circle cx="561.7319780454559" cy="364.8420008006076" r="13" fill="#1f2933"/><text x="561.7" y="369.8" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >3</text>
<rect x="426.5" y="493.7" width="184.0" height="90.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="518.5" y="521.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Bacteria break it</text>
<text x="518.5" y="539.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >down in a sealed</text>
<text x="518.5" y="556.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >digester (3–4 weeks,</text>
<text x="518.5" y="574.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >no oxygen)</text>
<circle cx="426.4709347793896" cy="493.70830659902003" r="13" fill="#1f2933"/><text x="426.5" y="498.7" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >4</text>
<rect x="209.5" y="502.2" width="184.0" height="73.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="301.5" y="530.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Biogas (methane)</text>
<text x="301.5" y="547.7" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >collected and</text>
<text x="301.5" y="565.2" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >cleaned</text>
<circle cx="209.5290652206105" cy="502.20830659902003" r="13" fill="#1f2933"/><text x="209.5" y="507.2" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >5</text>
<rect x="74.3" y="356.3" width="184.0" height="73.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="166.3" y="384.3" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Gas used for</text>
<text x="166.3" y="401.8" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >electricity, heating</text>
<text x="166.3" y="419.3" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >and vehicle fuel</text>
<circle cx="74.26802195454405" cy="356.34200080060754" r="13" fill="#1f2933"/><text x="74.3" y="361.3" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >6</text>
<rect x="122.5" y="174.4" width="184.0" height="73.0" rx="10" fill="#ffffff" stroke="#1f2933" stroke-width="1.6"/>
<text x="214.5" y="202.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >Leftover digestate</text>
<text x="214.5" y="219.9" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >spread on fields as</text>
<text x="214.5" y="237.4" font-size="14" text-anchor="middle" font-weight="normal" fill="#1f2933" >fertiliser</text>
<circle cx="122.54212938299253" cy="174.44969260037232" r="13" fill="#1f2933"/><text x="122.5" y="179.4" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >7</text>
<text x="410.0" y="339.0" font-size="22" text-anchor="middle" font-weight="bold" fill="#548235" >Biogas</text>
<text x="410.0" y="365.4" font-size="22" text-anchor="middle" font-weight="bold" fill="#548235" >cycle</text>
</svg>
