<circle cx="40" cy="308" r="13" fill="#1f2933"/><text x="40.0" y="313.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >1</text>
<text x="60.0" y="306.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >Warm, moist air</text>
<text x="60.0" y="323.5" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >moves in from the ocean</text>
<circle cx="130" cy="225" r="13" fill="#1f2933"/><text x="130.0" y="230.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >2</text>
<text x="150.0" y="223.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >Air is forced up</text>
<text x="150.0" y="240.5" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >the mountain</text>
<circle cx="70" cy="150" r="13" fill="#1f2933"/><text x="70.0" y="155.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >3</text>
<text x="90.0" y="148.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >Air cools; water vapour</text>
<text x="90.0" y="165.5" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >condenses into clouds</text>
<circle cx="470" cy="62" r="13" fill="#1f2933"/><text x="470.0" y="67.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >4</text>
<text x="490.0" y="60.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >Heavy rain on the</text>
<text x="490.0" y="77.5" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >windward slope</text>
<circle cx="600" cy="138" r="13" fill="#1f2933"/><text x="600.0" y="143.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >5</text>
<text x="620.0" y="136.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >Dry air sinks and</text>
<text x="620.0" y="153.5" font-size="14" text-anchor="start" font-weight="normal" fill="#1f2933" >warms up</text>
<circle cx="628" cy="288" r="13" fill="#1f2933"/><text x="628.0" y="293.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#ffffff" >6</text>
