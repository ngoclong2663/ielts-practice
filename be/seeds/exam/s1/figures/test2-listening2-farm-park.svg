<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" font-family="system-ui, sans-serif" font-size="13" fill="#334155">
  <rect x="0" y="0" width="640" height="440" fill="#ffffff"/>
  <!-- compass -->
  <g stroke="#334155" stroke-width="1.5" fill="none">
    <line x1="590" y1="12" x2="590" y2="48"/>
    <line x1="572" y1="30" x2="608" y2="30"/>
    <path d="M590 12 l-4 8 h8 z" fill="#334155"/>
  </g>
  <text x="590" y="10" text-anchor="middle" font-size="11" dy="-1">N</text>
  <text x="590" y="60" text-anchor="middle" font-size="11">S</text>
  <text x="565" y="34" text-anchor="end" font-size="11">W</text>
  <text x="615" y="34" font-size="11">E</text>
  <!-- site boundary -->
  <rect x="30" y="70" width="580" height="330" fill="#f8fafc" stroke="#334155" stroke-width="1.5"/>
  <!-- lane -->
  <rect x="0" y="408" width="640" height="26" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="140" y="426" text-anchor="middle" font-size="12">Ashcombe Lane</text>
  <!-- entrance gap -->
  <rect x="300" y="396" width="40" height="14" fill="#f8fafc"/>
  <text x="365" y="426" font-size="12" font-weight="600">Entrance ↑</text>
  <!-- river on the west side -->
  <path d="M48 70 C 62 120, 40 170, 56 220 S 46 330, 58 400 L 80 400 C 68 330, 78 270, 76 220 S 84 120, 70 70 Z" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
  <text x="64" y="245" text-anchor="middle" font-size="12" transform="rotate(-90 64 245)">River Ash</text>
  <!-- paths -->
  <g stroke="#e2e8f0" stroke-width="12" fill="none" stroke-linecap="round">
    <line x1="320" y1="400" x2="320" y2="150"/>
    <line x1="210" y1="200" x2="530" y2="200"/>
    <line x1="140" y1="200" x2="210" y2="200"/>
    <line x1="140" y1="200" x2="140" y2="145"/>
    <line x1="140" y1="200" x2="140" y2="330"/>
    <line x1="380" y1="350" x2="470" y2="360"/>
    <line x1="490" y1="200" x2="490" y2="180"/>
  </g>
  <!-- orchard -->
  <rect x="450" y="85" width="145" height="95" fill="#dcfce7" stroke="#334155" stroke-width="1.5"/>
  <g fill="#bbf7d0" stroke="#334155" stroke-width="1">
    <circle cx="500" cy="105" r="6"/><circle cx="530" cy="130" r="6"/><circle cx="545" cy="100" r="6"/>
    <circle cx="510" cy="155" r="6"/><circle cx="555" cy="160" r="6"/><circle cx="585" cy="140" r="6"/>
  </g>
  <text x="522" y="176" text-anchor="middle" font-size="12">Orchard</text>
  <!-- pond -->
  <ellipse cx="320" cy="205" rx="55" ry="32" fill="#dbeafe" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="209" text-anchor="middle" font-size="12">Pond</text>
  <!-- farmhouse -->
  <rect x="260" y="320" width="120" height="62" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="320" y="347" text-anchor="middle" font-size="12" font-weight="600">Farmhouse</text>
  <text x="320" y="364" text-anchor="middle" font-size="11">(tickets)</text>
  <!-- car park -->
  <rect x="470" y="325" width="125" height="70" fill="#e2e8f0" stroke="#334155" stroke-width="1.5"/>
  <text x="532" y="364" text-anchor="middle" font-size="12">Car park</text>
  <!-- candidate places -->
  <g fill="#f1f5f9" stroke="#334155" stroke-width="1.5">
    <rect x="100" y="335" width="130" height="50"/>
    <rect x="105" y="90" width="70" height="50"/>
    <rect x="170" y="178" width="70" height="52"/>
    <path d="M285 88 h70 v28 h-30 v24 h-40 z"/>
    <rect x="395" y="178" width="60" height="55"/>
    <rect x="520" y="215" width="75" height="80" fill="#dcfce7"/>
    <rect x="395" y="330" width="50" height="45"/>
  </g>
  <g fill="#ffffff" stroke="#334155" stroke-width="1.5">
    <circle cx="165" cy="360" r="11"/>
    <circle cx="140" cy="115" r="11"/>
    <circle cx="205" cy="204" r="11"/>
    <circle cx="305" cy="110" r="11"/>
    <circle cx="425" cy="205" r="11"/>
    <circle cx="557" cy="255" r="11"/>
    <circle cx="575" cy="103" r="11"/>
    <circle cx="470" cy="155" r="11"/>
    <circle cx="420" cy="352" r="11"/>
  </g>
  <g font-size="12" font-weight="700" text-anchor="middle">
    <text x="165" y="364">A</text>
    <text x="140" y="119">B</text>
    <text x="205" y="208">C</text>
    <text x="305" y="114">D</text>
    <text x="425" y="209">E</text>
    <text x="557" y="259">F</text>
    <text x="575" y="107">G</text>
    <text x="470" y="159">H</text>
    <text x="420" y="356">I</text>
  </g>
</svg>
